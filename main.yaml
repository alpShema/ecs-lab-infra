AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECS CI/CD Lab - Single stack.
  Provisions VPC, ECS Fargate cluster, ALB, ECR, CodeDeploy blue/green,
  CodePipeline, EventBridge, and GitHub Actions OIDC role.

# ---------------------------------------------------------------------------
# Parameters — inputs that can be overridden without changing the template.
# All resource names are derived from ProjectName so everything stays consistent.
# ---------------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: ecs-lab
    Description: Prefix used for all resource names (e.g. ecs-lab-vpc, ecs-lab-cluster).

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: IP address range for the entire VPC.

  PublicSubnetACidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR for the first public subnet (ALB) in AZ-a.

  PublicSubnetBCidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR for the second public subnet (ALB) in AZ-b.

  PrivateSubnetACidr:
    Type: String
    Default: 10.0.3.0/24
    Description: CIDR for the first private subnet (ECS tasks) in AZ-a.

  PrivateSubnetBCidr:
    Type: String
    Default: 10.0.4.0/24
    Description: CIDR for the second private subnet (ECS tasks) in AZ-b.

  ContainerPort:
    Type: Number
    Default: 8080
    Description: Port the Spring Boot application listens on inside the container.

  TaskCpu:
    Type: String
    Default: "512"
    Description: CPU units for the Fargate task (512 = 0.5 vCPU).

  TaskMemory:
    Type: String
    Default: "1024"
    Description: Memory in MB for the Fargate task.

  HealthCheckPath:
    Type: String
    Default: /actuator/health
    Description: ALB and ECS health check endpoint — provided by Spring Boot Actuator.

  GitHubOrg:
    Type: String
    Default: alpShema
    Description: GitHub username or organization — used to scope the OIDC trust condition.

  GitHubAppRepo:
    Type: String
    Default: ecs-lab-app
    Description: GitHub repository name for the application code.

  GitHubBranch:
    Type: String
    Default: main
    Description: Branch allowed to assume the GitHub Actions IAM role via OIDC.

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # ==========================================================================
  # NETWORK
  # Two public subnets (ALB) and two private subnets (ECS tasks) across two
  # Availability Zones for high availability. ECS tasks never have public IPs —
  # all inbound traffic flows through the ALB.
  # ==========================================================================

  # Isolated virtual network that all resources live inside.
  # DNS settings are required for VPC Endpoints to resolve AWS service names privately.
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpc
        - Key: Project
          Value: !Ref ProjectName

  # Allows resources in public subnets to send and receive internet traffic.
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-igw
        - Key: Project
          Value: !Ref ProjectName

  # Attaches the Internet Gateway to the VPC — required before any internet routing works.
  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public subnet in AZ-a — hosts the ALB and NAT Gateway.
  # MapPublicIpOnLaunch assigns a public IP to resources launched here.
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-a
        - Key: Project
          Value: !Ref ProjectName
        - Key: Tier
          Value: public

  # Public subnet in AZ-b — second AZ for ALB multi-AZ availability.
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-b
        - Key: Project
          Value: !Ref ProjectName
        - Key: Tier
          Value: public

  # Private subnet in AZ-a — ECS Fargate tasks run here with no public IP.
  # Outbound internet access goes through NatGatewayA.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-a
        - Key: Project
          Value: !Ref ProjectName
        - Key: Tier
          Value: private

  # Private subnet in AZ-b — second AZ for ECS task resilience.
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-b
        - Key: Project
          Value: !Ref ProjectName
        - Key: Tier
          Value: private

  # Static public IP for NatGatewayA. DependsOn ensures the IGW is attached first.
  EipA:
    Type: AWS::EC2::EIP
    DependsOn: IGWAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-eip-a
        - Key: Project
          Value: !Ref ProjectName

  # Static public IP for NatGatewayB.
  EipB:
    Type: AWS::EC2::EIP
    DependsOn: IGWAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-eip-b
        - Key: Project
          Value: !Ref ProjectName

  # NAT Gateway in AZ-a — allows ECS tasks in PrivateSubnetA to reach the internet
  # (e.g. pulling images) without being directly reachable from outside.
  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt EipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-nat-a
        - Key: Project
          Value: !Ref ProjectName

  # NAT Gateway in AZ-b — keeps AZ-b tasks operational if AZ-a NAT fails.
  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt EipB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-nat-b
        - Key: Project
          Value: !Ref ProjectName

  # Route table shared by both public subnets.
  # All outbound traffic (0.0.0.0/0) goes directly to the Internet Gateway.
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-rt
        - Key: Project
          Value: !Ref ProjectName

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # Separate route table for PrivateSubnetA — outbound traffic goes through NatGatewayA.
  # Each private subnet gets its own route table so AZ failures are isolated.
  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-rt-a
        - Key: Project
          Value: !Ref ProjectName

  PrivateRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  PrivateSubnetARouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  # Route table for PrivateSubnetB — outbound traffic goes through NatGatewayB.
  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-rt-b
        - Key: Project
          Value: !Ref ProjectName

  PrivateRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayB

  PrivateSubnetBRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  # ── Security Groups ───────────────────────────────────────────────────────

  # ALB accepts HTTP on port 80 (production traffic) and port 8080 (test traffic
  # used during blue/green deployments to validate the new version before go-live).
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - inbound HTTP from internet
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from internet
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: Alt port for blue/green second listener
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-alb-sg
        - Key: Project
          Value: !Ref ProjectName

  # ECS tasks only accept traffic from the ALB — never directly from the internet.
  # Egress on 443 allows tasks to reach ECR and CloudWatch Logs via VPC Endpoints.
  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS Fargate tasks - inbound from ALB only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: From ALB only
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to ECR endpoints and AWS APIs
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-ecs-sg
        - Key: Project
          Value: !Ref ProjectName

  # Defined as a separate resource to avoid a circular dependency.
  # If ALB egress referenced ECS and ECS ingress referenced ALB in the same resource,
  # CloudFormation cannot determine which to create first.
  AlbToEcsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !Ref EcsSecurityGroup
      Description: To ECS tasks only

  # VPC Endpoints only accept HTTPS traffic from ECS tasks — nothing else in the VPC.
  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: VPC Endpoints - inbound HTTPS from ECS only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref EcsSecurityGroup
          Description: From ECS tasks only
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpce-sg
        - Key: Project
          Value: !Ref ProjectName

  # ── VPC Endpoints ─────────────────────────────────────────────────────────
  # VPC Endpoints let ECS tasks reach AWS services privately without going through
  # the NAT Gateway — traffic stays inside the AWS network, improving security
  # and reducing data transfer costs.

  # Allows ECS to pull Docker image layers from ECR privately.
  # PrivateDnsEnabled makes the public ECR hostname resolve to a private IP inside the VPC.
  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.dkr
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  # Allows ECS to call ECR API operations (auth token, describe repositories) privately.
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.api
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  # Gateway endpoint for S3 — ECR stores image layers in S3, so this keeps
  # image pulls entirely within the AWS network. Gateway endpoints are free
  # and work by adding entries to the private route tables.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTableA
        - !Ref PrivateRouteTableB

  # Allows ECS containers to send logs to CloudWatch Logs privately.
  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  # ==========================================================================
  # ECR / LOGGING / IAM ROLES
  # ==========================================================================

  # Container image registry for the application.
  # IMMUTABLE tags prevent any image from being overwritten once pushed —
  # every git SHA tag is permanent, guaranteeing deployment reproducibility.
  # ScanOnPush checks each image for known CVE vulnerabilities automatically.
  # The lifecycle policy keeps only the last 10 images to control storage costs.
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${ProjectName}-app
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 10 images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 10
              },
              "action": { "type": "expire" }
            }]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # CloudWatch Log Group where container stdout/stderr is sent.
  # RetentionInDays automatically deletes logs older than 14 days to control costs.
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Used by the ECS agent (not the application) to pull images from ECR
  # and send logs to CloudWatch. The managed policy grants exactly these permissions.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-task-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Used by the application code running inside the container.
  # Currently has no permissions — add policies here if the app needs to call
  # AWS services (S3, DynamoDB, SQS, etc.). Keeping it empty follows least privilege.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Allows Application Auto Scaling to adjust the ECS service desired count.
  AutoScalingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-autoscaling-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: application-autoscaling.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceAutoscaleRole
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Allows CodeDeploy to manage the blue/green deployment — register task definitions,
  # update the ECS service, and shift traffic between ALB target groups.
  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-codedeploy-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ==========================================================================
  # ALB / TARGET GROUPS / LISTENERS
  # ==========================================================================

  # Internet-facing ALB placed in both public subnets for multi-AZ availability.
  # All user traffic enters here — ECS tasks are never exposed directly.
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ProjectName}-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Blue target group — holds the currently running (stable) version of the app.
  # TargetType: ip is required for Fargate (tasks use IPs, not EC2 instance IDs).
  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-blue-tg
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Green target group — holds the new version during a blue/green deployment.
  # CodeDeploy routes test traffic here first, validates health, then switches production.
  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-green-tg
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Production listener — serves real user traffic on port 80, initially routed to Blue.
  # CodeDeploy switches this to Green after a successful deployment.
  ProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  # Test listener — serves validation traffic on port 8080, initially routed to Green.
  # Used during deployment to verify the new version is healthy before going live.
  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 8080
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GreenTargetGroup

  # ==========================================================================
  # ECS CLUSTER / TASK DEFINITION / SERVICE / AUTO SCALING
  # ==========================================================================

  # Logical grouping for ECS tasks. Container Insights enabled for enhanced
  # per-task CPU and memory metrics in CloudWatch.
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${ProjectName}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Describes how to run the container — image, CPU, memory, networking, logging,
  # environment variables, and health check. The image tag 'latest' is used here
  # for the initial stack deployment only. All subsequent deployments use a specific
  # git SHA tag injected by CodePipeline from imageDetail.json.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${ProjectName}-task
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub ${ProjectName}-container
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-app:latest
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: SERVER_PORT
              Value: !Sub "${ContainerPort}"
            - Name: SPRING_PROFILES_ACTIVE
              Value: prod
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub "wget -q -O- http://localhost:${ContainerPort}/actuator/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Runs and maintains the desired number of tasks, registers them with the ALB,
  # and hands deployment control to CodeDeploy (CODE_DEPLOY type).
  # Tasks run in private subnets with no public IP — only the ALB can reach them.
  # DependsOn ensures both listeners exist before the service registers with the ALB.
  EcsService:
    Type: AWS::ECS::Service
    DependsOn:
      - ProdListener
      - TestListener
    Properties:
      ServiceName: !Sub ${ProjectName}-service
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
          SecurityGroups:
            - !Ref EcsSecurityGroup
      LoadBalancers:
        - ContainerName: !Sub ${ProjectName}-container
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref BlueTargetGroup
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Registers the ECS service as a scalable target — min 1 task, max 4 tasks.
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 4
      MinCapacity: 1
      ResourceId: !Sub service/${EcsCluster}/${EcsService.Name}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      RoleARN: !GetAtt AutoScalingRole.Arn

  # Scales tasks in/out based on average CPU utilization across all running tasks.
  # Target: 70% CPU — adds tasks when above, removes when below.
  # ScaleOutCooldown is short (60s) to respond quickly to traffic spikes.
  # ScaleInCooldown is longer (300s) to avoid removing tasks too aggressively.
  ScaleOutPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${ProjectName}-scale-out
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # ==========================================================================
  # CODEDEPLOY — BLUE/GREEN
  # ==========================================================================

  # Registers this as a CodeDeploy application targeting ECS (not EC2 or Lambda).
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub ${ProjectName}-deploy-app
      ComputePlatform: ECS
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Defines the blue/green deployment behaviour:
  # - ECSAllAtOnce: shifts 100% of traffic at once (not canary/linear)
  # - TerminationWaitTimeInMinutes: 5 — keeps old (Blue) tasks alive for 5 minutes
  #   after traffic switches to Green, giving time to roll back if issues arise
  # - CONTINUE_DEPLOYMENT: automatically proceeds without waiting for manual approval
  # - ProdTrafficRoute / TestTrafficRoute: links the two ALB listeners so CodeDeploy
  #   knows which carries production vs validation traffic
  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub ${ProjectName}-dg
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - !Ref ProdListener
            TestTrafficRoute:
              ListenerArns:
                - !Ref TestListener
            TargetGroups:
              - Name: !GetAtt BlueTargetGroup.TargetGroupName
              - Name: !GetAtt GreenTargetGroup.TargetGroupName
      ECSServices:
        - ClusterName: !Ref EcsCluster
          ServiceName: !GetAtt EcsService.Name
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ==========================================================================
  # PIPELINE — S3 ARTIFACT BUCKET + IAM ROLES + CODEPIPELINE + EVENTBRIDGE
  # ==========================================================================

  # S3 bucket that holds artifacts.zip (taskdef.json + imageDetail.json + appspec.yaml).
  # Versioning is required by CodePipeline's S3 source action to detect new uploads.
  # All public access is blocked. Old artifact versions are deleted after 30 days.
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-artifacts-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Bucket policy with three rules:
  # 1. Deny all access over plain HTTP (enforce HTTPS only)
  # 2. Allow CodePipeline role to read artifacts during pipeline execution
  # 3. Allow GitHub Actions role to upload artifacts.zip after building the image
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSSLOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub ${ArtifactBucket.Arn}/*
            Condition:
              Bool:
                'aws:SecureTransport': false
          - Sid: AllowCodePipeline
            Effect: Allow
            Principal:
              AWS: !GetAtt CodePipelineRole.Arn
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:GetBucketVersioning
              - s3:PutObject
              - s3:ListBucket
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub ${ArtifactBucket.Arn}/*
          - Sid: AllowGitHubActionsRole
            Effect: Allow
            Principal:
              AWS: !GetAtt GitHubActionsRole.Arn
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource: !Sub ${ArtifactBucket.Arn}/*

  # IAM role assumed by GitHub Actions via OIDC — no long-lived AWS credentials needed.
  # The Condition restricts access to a specific GitHub org, repo, and branch only.
  # Any other repository or branch is denied, even with a valid GitHub token.
  #
  # Permissions granted:
  # - ECRAuth: get a Docker login token (account-wide, required by AWS)
  # - ECRPush: push images to this specific ECR repository
  # - S3ArtifactUpload: upload artifacts.zip to the pipeline bucket
  # - CloudFormationRead: read stack outputs to get TaskExecutionRoleArn and TaskRoleArn
  # - PipelineTrigger: start the pipeline after the S3 upload completes
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-github-actions-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub':
                  !Sub 'repo:${GitHubOrg}/${GitHubAppRepo}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: ECRAndS3Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ECRAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: ECRPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                Resource: !GetAtt EcrRepository.Arn
              - Sid: S3ArtifactUpload
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub ${ArtifactBucket.Arn}/*
              - Sid: CloudFormationRead
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: '*'
              - Sid: PipelineTrigger
                Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-pipeline
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Service role used by CodePipeline to access other AWS services during execution.
  #
  # Permissions granted:
  # - S3Access: read artifacts.zip from the source stage
  # - S3BucketAccess: list bucket and check versioning (required by S3 source action)
  # - CodeDeployAccess: create deployments and read deployment status
  # - ECSAccess: register new task definition revisions
  # - PassRole: pass TaskExecutionRole and TaskRole to ECS when registering a task definition
  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-codepipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub ${ArtifactBucket.Arn}/*
              - Sid: S3BucketAccess
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketVersioning
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: CodeDeployAccess
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                  - codedeploy:GetDeploymentGroup
                Resource: '*'
              - Sid: ECSAccess
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                Resource: '*'
              - Sid: PassRole
                Effect: Allow
                Action: iam:PassRole
                Resource: '*'
                Condition:
                  StringEqualsIfExists:
                    'iam:PassedToService':
                      - ecs-tasks.amazonaws.com
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Allows EventBridge to call StartPipelineExecution when an ECR push event fires.
  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-eventbridge-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartPipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Two-stage pipeline:
  # Stage 1 (Source): reads artifacts.zip from S3. PollForSourceChanges is false —
  # the pipeline is triggered explicitly by the GitHub Actions workflow after upload,
  # not by constant polling.
  # Stage 2 (Deploy): calls CodeDeployToECS. Image1ContainerName tells CodePipeline
  # to replace the <IMAGE1_NAME> placeholder in taskdef.json with the ImageURI
  # from imageDetail.json before registering the new task definition.
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${ProjectName}-pipeline
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: ImageDefinitions
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: '1'
              Configuration:
                S3Bucket: !Ref ArtifactBucket
                S3ObjectKey: artifacts.zip
                PollForSourceChanges: 'false'
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: BlueGreenDeploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup
                TaskDefinitionTemplateArtifact: SourceArtifact
                AppSpecTemplateArtifact: SourceArtifact
                Image1ArtifactName: SourceArtifact
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # EventBridge rule that watches for successful image pushes to the ECR repository.
  # This provides an automatic trigger in addition to the explicit pipeline start
  # called by the GitHub Actions workflow after uploading artifacts.zip.
  EcrPushEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${ProjectName}-ecr-push-rule
      Description: Trigger CodePipeline on ECR image push
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - ECR Image Action
        detail:
          action-type:
            - PUSH
          result:
            - SUCCESS
          repository-name:
            - !Ref EcrRepository
      State: ENABLED
      Targets:
        - Id: TriggerPipeline
          Arn: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}
          RoleArn: !GetAtt EventBridgeRole.Arn

# ---------------------------------------------------------------------------
# Outputs — values exported from the stack for use in GitHub repo variables
# and by the GitHub Actions workflow at runtime.
# ---------------------------------------------------------------------------
Outputs:
  AlbEndpoint:
    Description: Application URL — open this to see the live app.
    Value: !Sub http://${ALB.DNSName}

  GitHubActionsRoleArn:
    Description: Set as AWS_ROLE_ARN variable in the ecs-lab-app GitHub repo.
    Value: !GetAtt GitHubActionsRole.Arn

  ArtifactBucketName:
    Description: Set as PIPELINE_ARTIFACT_BUCKET variable in the ecs-lab-app GitHub repo.
    Value: !Ref ArtifactBucket

  TaskExecutionRoleArn:
    Description: Read by the GitHub Actions workflow to build taskdef.json.
    Value: !GetAtt TaskExecutionRole.Arn

  TaskRoleArn:
    Description: Read by the GitHub Actions workflow to build taskdef.json.
    Value: !GetAtt TaskRole.Arn

  EcrRepositoryUri:
    Description: ECR registry URI — the destination for docker push.
    Value: !GetAtt EcrRepository.RepositoryUri

  PipelineUrl:
    Description: Direct link to the CodePipeline dashboard.
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view
